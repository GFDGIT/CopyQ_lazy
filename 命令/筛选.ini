[Command]
Name=筛选
Command="
    copyq:
    var image = {
        [mimeText]: '图片 ---------------- i',
        [mimeIcon]: '',
        filter: '(^image/.*)|(?=^file\\:.*\\.(png|jpe?g|bmp|svg|gif|webp|ico)$)',
        shortcut: 'i'
    }

    var file = {
        [mimeText]: '文件  ---------------- f',
        [mimeIcon]: '',
        filter: '(?=^file://)',
        shortcut: 'f'
    }

    var url = {
        [mimeText]: 'URL ---------------- u',
        [mimeIcon]: '',
        filter: '^(?=(https?|ftps?|smb|mailto)://)',
        shortcut: 'u'
    }

    var html = {
        [mimeText]: 'HTML',
        [mimeIcon]: '',
        filter: '^text/html$',
        shortcut: 'h'
    }

    var PhoneMail = {
        [mimeText]: '手机号/邮箱',
        [mimeIcon]: '',
        filter: '(^0{0,1}(13[0-9]|15[7-9]|153|156|18[7-9])[0-9]{8}$)|(^([a-zA-Z0-9]+[_|\\_|\\.]?)*[a-zA-Z0-9]+@([a-zA-Z0-9]+[_|\\_|\\.]?)*[a-zA-Z0-9]+\\.[a-zA-Z]{2,3}$)',
        shortcut: 'p'
    }

    var tagFilter = {
        [mimeText]: '过滤标签 (t)',
        [mimeIcon]: '',
        filter: '',
        shortcut: 't'
    }

    var filters = [image, file, url, html, PhoneMail]

    const tags_mime = 'application/x-copyq-tags'
    var tag = data(tags_mime).toString().split(',')[0];

    if (tag) {
        tagFilter[mimeText] = \"标签：\" + tag
        tagFilter.filter = tag
        filters.push(tagFilter)
    }

    var selectedFilter = ''
    var shortcut = str(data(mimeShortcut))

    if (shortcut) {
        for (let f in filters) {
            if (filters[f].shortcut === shortcut) {
                selectedFilter = filters[f].filter
                filter_toggle(selectedFilter)
                abort()
           }
        }
    }

    var selectedIndex = menuItems(filters)

    if (selectedIndex != -1) {
        selectedFilter = filters[selectedIndex].filter
        filter_toggle(selectedFilter)
    } else {
        filter('')
    }

    function filter_toggle(filter_) {
        if (filter() == filter_) {
            filter('')
        }
        else {
            filter('')
            filter(filter_)
        }
    }"
InMenu=true
Icon=
Shortcut=shift+f, f, i, u, t